[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-suite-sdk"
version = "1.1.21"
description = "Cortex SDK — transport client for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "jsonschema>=4.23",
    "anyio[trio]",
]

[tool.hatch.build.targets.wheel]
packages = ["cortex_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.10"

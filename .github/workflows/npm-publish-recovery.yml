name: npm publish recovery

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.1.21
          fetch-depth: 0

      - name: Verify exact release commit
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "v1.1.21"
          test "$(git rev-parse HEAD)" = "0f4fb470339105218e4474d4c937c9cae241e59c"
          test "$(node -p "require('./js/package.json').version")" = "1.1.21"
          test "$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('python/pyproject.toml').read_text()
          match = re.search(r'^version = \"([^\"]+)\"$', text, re.MULTILINE)
          assert match, 'python version is missing'
          print(match.group(1))
          PY
          )" = "1.1.21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Build and verify
        run: |
          npm --prefix js ci
          npm --prefix js test
          npm --prefix js run build
          npm --prefix js run smoke
          cd js && npm pack --dry-run

      - name: Build Python release artifacts
        run: |
          python -m pip install build
          python -m build python
          python scripts/smoke_python_package.py

      - name: Publish npm via OIDC
        working-directory: js
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          set +e
          existing_version="$(npm view @cortex-suite/sdk@1.1.21 version 2>"$error_file")"
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ]; then
            test "$existing_version" = "1.1.21"
            echo "@cortex-suite/sdk@1.1.21 already exists; skipping publish"
          elif grep -qE 'E404|No match found for version' "$error_file"; then
            npm publish --access public --ignore-scripts
          else
            cat "$error_file" >&2
            exit "$view_status"
          fi

      - name: Bundle JavaScript release assets
        run: |
          mkdir -p release-assets
          cd js
          zip -qr "../release-assets/cortex-sdk-js-dist-v1.1.21.zip" dist
          cp ../python/dist/* ../release-assets/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.21
          generate_release_notes: true
          files: release-assets/*

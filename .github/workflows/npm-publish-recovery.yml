name: npm publish recovery

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.1.21
          fetch-depth: 0

      - name: Verify exact release commit
        run: |
          test "$(git rev-parse HEAD)" = "0f4fb470339105218e4474d4c937c9cae241e59c"
          test "$(node -p "require('./js/package.json').version")" = "1.1.21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Build and verify
        run: |
          npm --prefix js ci
          npm --prefix js test
          npm --prefix js run build
          npm --prefix js run smoke
          cd js && npm pack --dry-run

      - name: Publish npm via OIDC
        working-directory: js
        run: npm publish --access public --ignore-scripts

name: Release

on:
  workflow_dispatch:
    inputs:
      recover_npm:
        description: 'Complete npm/GitHub 1.1.22 using qualified run 43462797037 (requires separate OWNER GO)'
        type: boolean
        default: false
      diagnose_npm:
        description: 'Read-only npm authentication and permission diagnostics'
        type: boolean
        default: false
      client_repository:
        description: 'Release the next client package after SDK completion'
        type: choice
        options: [none, sdk-ui, chat-widget]
        default: none
      client_sha:
        description: 'Exact client source SHA'
        type: string
      package_sha256:
        description: 'SHA256 of the qualified npm tarball'
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  validate-shared:
    if: ${{ !inputs.diagnose_npm && !inputs.recover_npm && (inputs.client_repository == '' || inputs.client_repository == 'none') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate generated shared artifacts
        run: |
          python scripts/generate_shared_artifacts.py
          if ! git diff --quiet -- js/src/generated python/cortex_sdk/_generated_constants.py python/cortex_sdk/_generated_errors.py; then
            echo "::error::Generated shared artifacts are out of date. Run 'python scripts/generate_shared_artifacts.py' and commit the results."
            git --no-pager diff -- js/src/generated python/cortex_sdk/_generated_constants.py python/cortex_sdk/_generated_errors.py
            exit 1
          fi

  build-js:
    runs-on: ubuntu-latest
    needs: validate-shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Run JS tests
        working-directory: js
        run: npm test

      - name: Build JS artifacts
        run: |
          rm -rf js/dist
          npm --prefix js run build

      - name: Smoke-check JS package
        working-directory: js
        run: npm run smoke

      - name: Upload JS dist
        uses: actions/upload-artifact@v6
        with:
          name: js-dist
          path: |
            js/dist/
          if-no-files-found: error
          retention-days: 90

  build-python:
    runs-on: ubuntu-latest
    needs: validate-shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Run Python tests
        run: python -m pytest python/tests

      - name: Build Python package
        run: |
          python -m pip install build
          rm -rf python/dist
          python -m build python

      - name: Smoke-check Python package
        run: python scripts/smoke_python_package.py

      - name: Upload Python dist
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error
          retention-days: 90

  verify-release:
    runs-on: ubuntu-latest
    needs: [build-js, build-python]
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: js/dist

      - name: Download Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: python/dist

      - name: Validate version and tag consistency
        shell: bash
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag must look like vX.Y.Z or vX.Y.Z-suffix"
              exit 1
            fi
            TAG_VERSION="${REF_NAME#v}"
          else
            mapfile -t HEAD_TAGS < <(git tag --points-at HEAD --list 'v*')
            if [ "${#HEAD_TAGS[@]}" -eq 0 ]; then
              echo "::error::workflow_dispatch must target a commit that already has a v* tag"
              exit 1
            fi
            if [ "${#HEAD_TAGS[@]}" -gt 1 ]; then
              echo "::error::workflow_dispatch found multiple v* tags on HEAD: ${HEAD_TAGS[*]}"
              exit 1
            fi
            TAG_VERSION="${HEAD_TAGS[0]#v}"
          fi

          JS_VERSION=$(node -p "require('./js/package.json').version")
          JS_NAME=$(node -p "require('./js/package.json').name")
          JS_REPOSITORY_URL=$(node -p "require('./js/package.json').repository.url")
          EXPECTED_REPOSITORY_URL="git+https://github.com/${{ github.repository }}.git"

          PY_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re
          wheel = next(Path("python/dist").glob("*.whl"))
          match = re.match(r".+?-([0-9][^-]*)-", wheel.name)
          if match is None:
              raise SystemExit(f"Could not parse Python version from {wheel.name}")
          print(match.group(1))
          PY
          )

          echo "Tag version:    $TAG_VERSION"
          echo "JS version:     $JS_VERSION"
          echo "Python version: $PY_VERSION"

          if [ "$JS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: js/package.json=$JS_VERSION python/dist=$PY_VERSION"
            exit 1
          fi

          if [ "$JS_NAME" != "@cortex-suite/sdk" ]; then
            echo "::error::Unexpected package name: $JS_NAME"
            exit 1
          fi

          if [ "$JS_REPOSITORY_URL" != "$EXPECTED_REPOSITORY_URL" ]; then
            echo "::error::repository.url mismatch: got $JS_REPOSITORY_URL, expected $EXPECTED_REPOSITORY_URL"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$JS_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match package version $JS_VERSION"
            exit 1
          fi

      - name: Validate npm package contents
        working-directory: js
        run: npm pack --dry-run

  publish-pypi:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: python/dist

      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publish-npm:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Download JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: js/dist

      - name: Publish JS package to npm
        working-directory: js
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish-pypi
      - publish-npm
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: release-assets/js-dist

      - name: Download Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: release-assets/python-dist

      - name: Bundle JS release assets
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/bundles
          cd release-assets/js-dist
          zip -r "../bundles/cortex-sdk-js-dist-${TAG_NAME}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/bundles/cortex-sdk-js-dist-${{ github.ref_name }}.zip
            release-assets/python-dist/**

  prune-build-artifacts:
    needs: [publish-pypi, publish-npm, github-release]
    if: ${{ always() && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success' && (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove previous successful build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const types = [{"name":"js-dist"},{"name":"python-dist"}];
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const options = { owner, repo, per_page: 100 };
            const current = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...options, run_id });
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, options);
            const runStatuses = new Map();
            for (const type of types) {
              const matches = artifact => type.name ? artifact.name === type.name : artifact.name.startsWith(type.prefix);
              const mine = current.filter(artifact => matches(artifact) && !artifact.expired)
                .sort((a, b) => a.created_at.localeCompare(b.created_at) || a.id - b.id).at(-1);
              if (!mine) {
                core.info(`No new artifact for ${JSON.stringify(type)} in run ${run_id}; keeping previous versions.`);
                continue;
              }
              for (const artifact of all.filter(matches)) {
                if (artifact.id === mine.id || artifact.created_at >= mine.created_at || artifact.expired) continue;
                const oldRunId = artifact.workflow_run?.id;
                if (!oldRunId || oldRunId === run_id) continue;
                if (!runStatuses.has(oldRunId)) {
                  const { data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: oldRunId });
                  runStatuses.set(oldRunId, data.status);
                }
                if (runStatuses.get(oldRunId) !== 'completed') continue;
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`Deleted previous ${artifact.name} artifact ${artifact.id}; retained ${mine.id}.`);
              }
            }

  recover-npm:
    name: Complete npm and GitHub 1.1.22
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.diagnose_npm && inputs.recover_npm && inputs.client_repository == 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the qualified release source
        uses: actions/checkout@v5
        with:
          ref: f18fcd523ade343dc830740e18485eb63fc32cf4

      - name: Verify original run and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA=f18fcd523ade343dc830740e18485eb63fc32cf4
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api repos/Cortex-Suite-Team/cortex-sdk/actions/runs/43462797037 --jq .head_sha)" = "$EXPECTED_SHA"
          test "$(git ls-remote --tags origin 'refs/tags/v1.1.22^{}' | cut -f1)" = "$EXPECTED_SHA"
          test "$(node -p "require('./js/package.json').version")" = 1.1.22

      - name: Set up Node.js and npm registry authentication
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.15.0

      - name: Download original qualified JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: js/dist
          run-id: 43462797037
          github-token: ${{ github.token }}

      - name: Download original published Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: python/dist
          run-id: 43462797037
          github-token: ${{ github.token }}

      - name: Verify exact original package bytes
        run: |
          set -euo pipefail
          (cd js && npm pack --ignore-scripts)
          printf '%s  %s\n' \
            b8b6d82010328239ea1dc9539e9ecfd35c138b4dda16bf2f2d5d58fdf3e7088e js/cortex-suite-sdk-1.1.22.tgz \
            4449fbf6ec91fec3749af2973e3f821bff497b8a63c86af7f7010a19f3c75aba python/dist/cortex_suite_sdk-1.1.22-py3-none-any.whl \
            97cd581836e7f504c946e50697d6ccb0c5d7cb282b55a4f8ea656ae4062c6ec4 python/dist/cortex_suite_sdk-1.1.22.tar.gz | sha256sum --check

      - name: Publish original JS package to npm
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish ./cortex-suite-sdk-1.1.22.tgz --access public --ignore-scripts

      - name: Create GitHub Release with original qualified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd js/dist && zip -r "$RUNNER_TEMP/cortex-sdk-js-dist-v1.1.22.zip" .)
          gh release create v1.1.22 --verify-tag --title v1.1.22 --generate-notes \
            "$RUNNER_TEMP/cortex-sdk-js-dist-v1.1.22.zip" \
            python/dist/cortex_suite_sdk-1.1.22-py3-none-any.whl \
            python/dist/cortex_suite_sdk-1.1.22.tar.gz

  publish-client:
    name: Publish qualified client package
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.diagnose_npm && !inputs.recover_npm && inputs.client_repository != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
    steps:
      - name: Check out exact client source
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.client_repository == 'sdk-ui' && 'Cortex-Suite-Team/cortex-sdk-ui' || 'Cortex-Suite-Team/cortex-chat-widget' }}
          ref: ${{ inputs.client_sha }}

      - name: Verify source and package identity
        env:
          SOURCE_SHA: ${{ inputs.client_sha }}
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require('./package.json').name")" = "@cortex-suite/$CLIENT_REPOSITORY"
          test "$(node -p "require('./package.json').version")" = 0.1.1

      - name: Set up Node.js and registry
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Pin npm and verify published predecessors
        env:
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
        run: |
          set -euo pipefail
          npm install --global npm@11.15.0
          test "$(npm view @cortex-suite/sdk@1.1.22 version)" = 1.1.22
          if [ "$CLIENT_REPOSITORY" = chat-widget ]; then
            test "$(npm view @cortex-suite/sdk-ui@0.1.1 version)" = 0.1.1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify contracts and production dependencies
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- --runInBand --silent
          npm audit --omit=dev

      - name: Build qualified package
        env:
          CLIENT_REPOSITORY: ${{ inputs.client_repository }}
        run: |
          set -euo pipefail
          if [ "$CLIENT_REPOSITORY" = chat-widget ]; then
            npm run check:reproducible
            npm run check:isolated-package
          else
            npm run build
          fi

      - name: Pack and verify frozen package bytes
        id: package
        env:
          EXPECTED_SHA256: ${{ inputs.package_sha256 }}
          SOURCE_SHA: ${{ inputs.client_sha }}
        run: |
          set -euo pipefail
          FILE=$(npm pack --ignore-scripts --json | jq -r '.[0].filename')
          printf '%s  %s\n' "$EXPECTED_SHA256" "$FILE" | sha256sum --check
          sha256sum "$FILE" > package.sha256
          printf 'source_sha=%s\nworkflow_sha=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-source.txt
          echo "filename=$FILE" >> "$GITHUB_OUTPUT"

      - name: Verify installed SDK and UI contract
        if: ${{ inputs.client_repository == 'sdk-ui' }}
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/native-client-consumer"
          mkdir "$CONSUMER"
          printf '{"private":true,"type":"module"}\n' > "$CONSUMER/package.json"
          npm install --prefix "$CONSUMER" --ignore-scripts --no-audit --no-fund \
            @cortex-suite/sdk@1.1.22 "$GITHUB_WORKSPACE/$PACKAGE_FILE"
          cat > "$CONSUMER/consumer.ts" <<'TS'
          import { CortexClient } from '@cortex-suite/sdk';
          import { createChatController, createHumanAssistanceController } from '@cortex-suite/sdk-ui';
          const client = new CortexClient({apiKey: 'package-check', onMessage: () => {}});
          const chat = createChatController({client});
          const ha = createHumanAssistanceController({client});
          if (ha.getCards().length !== 0) throw new Error('Unexpected HA inbox');
          ha.destroy(); chat.destroy();
          TS
          node node_modules/typescript/bin/tsc --strict --noEmit --target ES2022 \
            --module NodeNext --moduleResolution NodeNext "$CONSUMER/consumer.ts"
          cp "$CONSUMER/consumer.ts" "$CONSUMER/consumer.mjs"
          node "$CONSUMER/consumer.mjs"

      - name: Retain qualified package and provenance
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.client_repository }}-0.1.1
          path: |
            ${{ steps.package.outputs.filename }}
            package.sha256
            release-source.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish exact qualified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish "./$PACKAGE_FILE" --access public --ignore-scripts

  diagnose-npm:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_npm }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.15.0
      - name: Check authentication and package access without publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'const t=process.env.NODE_AUTH_TOKEN; if(!t || t!==t.trim()) throw new Error("Token is missing or contains surrounding whitespace"); console.log("Token presence/whitespace check: PASS")'
          npm --version
          npm config get registry
          npm whoami
          npm access list packages --json | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>console.log(JSON.stringify(Object.fromEntries(Object.entries(JSON.parse(s)).filter(([k])=>k.startsWith("@cortex-suite/"))))))'
          npm view @cortex-suite/sdk name version --json

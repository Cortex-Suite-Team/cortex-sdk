name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  validate-shared:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate generated shared artifacts
        run: |
          python scripts/generate_shared_artifacts.py
          if ! git diff --quiet -- js/src/generated python/cortex_sdk/_generated_constants.py python/cortex_sdk/_generated_errors.py; then
            echo "::error::Generated shared artifacts are out of date. Run 'python scripts/generate_shared_artifacts.py' and commit the results."
            git --no-pager diff -- js/src/generated python/cortex_sdk/_generated_constants.py python/cortex_sdk/_generated_errors.py
            exit 1
          fi

  build-js:
    runs-on: ubuntu-latest
    needs: validate-shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Run JS tests
        working-directory: js
        run: npm test

      - name: Build JS artifacts
        run: |
          rm -rf js/dist
          npm --prefix js run build

      - name: Smoke-check JS package
        working-directory: js
        run: npm run smoke

      - name: Upload JS dist
        uses: actions/upload-artifact@v6
        with:
          name: js-dist
          path: |
            js/dist/
          if-no-files-found: error
          retention-days: 1

  build-python:
    runs-on: ubuntu-latest
    needs: validate-shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./python[dev]"

      - name: Run Python tests
        run: python -m pytest python/tests

      - name: Build Python package
        run: |
          python -m pip install build
          rm -rf python/dist
          python -m build python

      - name: Smoke-check Python package
        run: python scripts/smoke_python_package.py

      - name: Upload Python dist
        uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error
          retention-days: 1

  verify-release:
    runs-on: ubuntu-latest
    needs: [build-js, build-python]
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: js/dist

      - name: Download Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: python/dist

      - name: Validate version and tag consistency
        shell: bash
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag must look like vX.Y.Z or vX.Y.Z-suffix"
              exit 1
            fi
            TAG_VERSION="${REF_NAME#v}"
          else
            mapfile -t HEAD_TAGS < <(git tag --points-at HEAD --list 'v*')
            if [ "${#HEAD_TAGS[@]}" -eq 0 ]; then
              echo "::error::workflow_dispatch must target a commit that already has a v* tag"
              exit 1
            fi
            if [ "${#HEAD_TAGS[@]}" -gt 1 ]; then
              echo "::error::workflow_dispatch found multiple v* tags on HEAD: ${HEAD_TAGS[*]}"
              exit 1
            fi
            TAG_VERSION="${HEAD_TAGS[0]#v}"
          fi

          JS_VERSION=$(node -p "require('./js/package.json').version")
          JS_NAME=$(node -p "require('./js/package.json').name")
          JS_REPOSITORY_URL=$(node -p "require('./js/package.json').repository.url")
          EXPECTED_REPOSITORY_URL="git+https://github.com/${{ github.repository }}.git"

          PY_VERSION=$(python - <<'PY'
          from pathlib import Path
          import re
          wheel = next(Path("python/dist").glob("*.whl"))
          match = re.match(r".+?-([0-9][^-]*)-", wheel.name)
          if match is None:
              raise SystemExit(f"Could not parse Python version from {wheel.name}")
          print(match.group(1))
          PY
          )

          echo "Tag version:    $TAG_VERSION"
          echo "JS version:     $JS_VERSION"
          echo "Python version: $PY_VERSION"

          if [ "$JS_VERSION" != "$PY_VERSION" ]; then
            echo "::error::Version mismatch: js/package.json=$JS_VERSION python/dist=$PY_VERSION"
            exit 1
          fi

          if [ "$JS_NAME" != "@cortex-suite/sdk" ]; then
            echo "::error::Unexpected package name: $JS_NAME"
            exit 1
          fi

          if [ "$JS_REPOSITORY_URL" != "$EXPECTED_REPOSITORY_URL" ]; then
            echo "::error::repository.url mismatch: got $JS_REPOSITORY_URL, expected $EXPECTED_REPOSITORY_URL"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$JS_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match package version $JS_VERSION"
            exit 1
          fi

      - name: Validate npm package contents
        working-directory: js
        run: npm pack --dry-run

  publish-pypi:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: python/dist

      - name: Publish Python package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  publish-npm:
    runs-on: ubuntu-latest
    needs: verify-release
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pin OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Download JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: js/dist

      - name: Publish JS package to npm
        working-directory: js
        run: npm publish --access public --ignore-scripts

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - publish-pypi
      - publish-npm
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download JS dist
        uses: actions/download-artifact@v6
        with:
          name: js-dist
          path: release-assets/js-dist

      - name: Download Python dist
        uses: actions/download-artifact@v6
        with:
          name: python-dist
          path: release-assets/python-dist

      - name: Bundle JS release assets
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/bundles
          cd release-assets/js-dist
          zip -r "../bundles/cortex-sdk-js-dist-${TAG_NAME}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/bundles/cortex-sdk-js-dist-${{ github.ref_name }}.zip
            release-assets/python-dist/**
